<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Explore jobs, track applications, build professional relationships, and understand your career journey in one secure workspace."
		/>
		<meta name="theme-color" content="#17372e" />
		<title>Career Journey | Jobs, applications, and networking</title>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317372e'/%3E%3Cpath d='M15 20h27v18a10 10 0 0 1-10 10h-7A10 10 0 0 1 15 38V20Zm27 5h4a7 7 0 0 1 0 14h-4' fill='none' stroke='%23e9653b' stroke-width='5'/%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="/styles.css?v=20261001-4" />
		<script src="/job-source.js?v=20261001-3" defer></script>
		<script src="/journey-progress.js?v=20261001-1" defer></script>
		<script src="/analytics-ui.js?v=20261001-1" defer></script>
		<script src="/app.js?v=20261001-4" defer></script>
	</head>
	<body>
		<noscript>
			<section class="noscript-card">
				<span class="brand-mark" aria-hidden="true">CJ</span>
				<h1>Career Journey needs JavaScript</h1>
				<p>
					This secure workspace uses JavaScript for authenticated navigation and
					data controls. You can still review the
					<a href="/privacy.html">Privacy Policy</a> and
					<a href="/terms.html">Terms of Service</a>.
				</p>
			</section>
		</noscript>
		<div id="app" class="shell" aria-live="polite">
			<section class="center-card">
				<div class="spinner" aria-hidden="true"></div>
				<p>Opening your career workspace…</p>
			</section>
		</div>
		<div id="toast" class="toast" role="status"></div>
		<dialog id="draft-dialog">
			<form method="dialog" class="dialog-card" id="draft-form">
				<div class="dialog-head">
					<div>
						<p class="eyebrow">Second approval gate</p>
						<h2 id="draft-name">Review draft</h2>
					</div>
					<button class="icon-button" value="cancel" aria-label="Close dialog">×</button>
				</div>
				<input id="draft-id" type="hidden" />
				<input id="draft-version" type="hidden" />
				<label>
					Recipient email
					<input id="draft-email" type="email" autocomplete="off" />
				</label>
				<label>
					Subject
					<input id="draft-subject" maxlength="200" />
				</label>
				<label>
					Body
					<textarea id="draft-body" rows="12"></textarea>
				</label>
				<label id="resume-attachment-row" class="check-row" hidden>
					<input id="attach-resume" type="checkbox" />
					<span id="resume-attachment-label">Attach resume</span>
				</label>
				<p id="draft-audit" class="notice"></p>
				<div class="actions">
					<button type="button" class="secondary" id="save-draft">Save changes</button>
					<button type="button" class="primary" id="send-draft">Approve and send</button>
				</div>
			</form>
		</dialog>
	</body>
</html>
